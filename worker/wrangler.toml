name = "fairytale-studio-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Rename via the Cloudflare dashboard or wrangler before deployment.
# The only public variable here is the allowed website origin.
[vars]
ALLOWED_ORIGIN = "https://kysg1233-design.github.io"
GITHUB_OWNER = "kysg1233-design"
GITHUB_REPO = "AI-FairyTale-Worker"
R2_BUCKET_NAME = "fairytale-private-videos"
R2_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "fairytale-private-videos"

[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
