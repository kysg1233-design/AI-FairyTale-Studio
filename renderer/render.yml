# Copy this file to .github/workflows/render.yml in the NEW PRIVATE repository.
# DO NOT run this workflow in the public homepage repository; private user video
# filenames, narration, and job status belong only in the private worker repo.
name: Render fairy tale video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Non-sensitive UUID from authenticated Worker
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout renderer code
        uses: actions/checkout@v4
      - name: Install FFmpeg and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk curl
      - name: Render private fairy tale
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_JOB_KEY: ${{ secrets.WORKER_JOB_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: python3 scripts/render.py
      - name: Report unexpected Actions failure
        if: ${{ failure() }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_JOB_KEY: ${{ secrets.WORKER_JOB_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl --fail --silent --show-error --max-time 20 \
            -X POST "${WORKER_URL%/}/internal/jobs/${JOB_ID}/status" \
            -H "Authorization: Bearer ${WORKER_JOB_KEY}" \
            -H 'Content-Type: application/json' \
            --data '{"status":"failed","stage":"GitHub Actions 실행 실패","detail":"합성 작업 단계나 서버 설정을 확인해 주세요."}' || true
