name: Daily Sakura storybook production
on:
  push:
    branches: [main]
    paths:
      - 'sakura/publish_weekly.py'
      - 'sakura/create_mood_music.py'
      - 'sakura/index.html'
      - '.github/workflows/sakura-weekly.yml'
  schedule:
    # 09:15 Korea Standard Time (UTC+9), once per day.
    - cron: "15 0 * * *"
  workflow_dispatch:

# One writer only. Never cancel a production run midway through image/audio generation.
concurrency:
  group: sakura-production-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: "1"
      SAKURA_BATCH_SIZE: "1"
      SAKURA_TARGET_BOOKS: "40"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install "beautifulsoup4==4.13.4" "Pillow==11.3.0" "mutagen==1.47.0" "imageio-ffmpeg==0.6.0"

      - name: Install portable audio encoder
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sf "$FFMPEG_BIN" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/ffmpeg-bin:$PATH"
          ffmpeg -version | head -n 1

      - name: Verify required secret
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::GEMINI_API_KEY is missing"; exit 1; }

      - name: Restore interrupted story generation
        uses: actions/cache/restore@v4
        with:
          path: sakura/books/_staging
          key: sakura-staging-v2-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            sakura-staging-v2-${{ github.ref_name }}-

      - name: Check source and generation code syntax
        run: |
          python -m py_compile sakura/publish_weekly.py sakura/prepare_title_audio.py
          python -m unittest sakura.test_publish_pipeline
          python - <<'PY'
          from sakura.publish_weekly import parse_json_object
          nl = chr(10)
          assert parse_json_object('{"pages": []}') == {"pages": []}
          assert parse_json_object('```json' + nl + '{"pages": []}' + nl + '```') == {"pages": []}
          assert parse_json_object('Here is the result:' + nl + '{"pages": []}' + nl + 'Done') == {"pages": []}
          print("Story JSON parser self-test passed")
          PY

      - name: Verify Gemini models
        shell: bash
        run: |
          set -euo pipefail
          for model in gemini-3.8-flash gemini-3.1-flash-image gemini-3.8-flash-lite-tts gemini-2.5-flash-preview-tts gemini-3.1-flash-tts-preview gemini-3.8-flash-tts; do
            status=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o /dev/null -w "%{http_code}" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              "https://generativelanguage.googleapis.com/v1beta/models/$model")
            if [ "$status" != "200" ]; then
              echo "::error::Gemini model $model unavailable (HTTP $status)"
              exit 1
            fi
            echo "Available: $model"
          done

      - name: Generate one complete storybook per daily run
        id: generate
        run: python sakura/publish_weekly.py

      - name: Compose background music and validate every asset
        run: |
          python sakura/create_mood_music.py
          python sakura/check_site.py
          test -s sakura/book-turn.js

      - name: Install pinned Chromium for real browser QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium

      - name: Test desktop and Galaxy touch navigation with audio
        id: browserqa
        run: |
          set -euo pipefail
          python -m http.server 8777 --bind 127.0.0.1 > /tmp/sakura-http.log 2>&1 &
          echo $! > /tmp/sakura-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8777/sakura/ >/dev/null && break
            sleep 1
          done
          SAKURA_URL=http://127.0.0.1:8777/sakura/ node sakura/qa_smoke.cjs

      - name: Write successful build receipt
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, datetime
          books=json.loads(pathlib.Path("sakura/books/index.json").read_text("utf-8"))["books"]
          receipt={
            "status":"success",
            "workflow":"daily",
            "run_id":os.environ["RUN_ID"],
            "source_commit":os.environ["COMMIT_SHA"],
            "time_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "completed_books":len(books),
            "newest_book":books[-1]["title"] if books else None,
            "titles":[b["title"] for b in books],
            "integrity_verified":True,
            "checks":["python_syntax","source_and_model_access","complete_media_validation","desktop_browser_qa","galaxy_touch_qa"]
          }
          pathlib.Path("sakura/build-status.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")
          print(json.dumps(receipt,ensure_ascii=False))
          PY

      - name: Commit and push once, after all checks pass
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sakura-story-bot"
          git config user.email "sakura-story-bot@users.noreply.github.com"
          rm -rf sakura/books/_staging
          git add -A sakura/books/ sakura/assets/
          git reset -q -- sakura/books/_staging/ || true
          git add sakura/build-status.json
          if git diff --cached --quiet; then
            echo "All storybook media was already committed safely during the batch; no extra commit is needed."
            exit 0
          fi
          git commit -m "Publish daily verified Sakura storybook"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Published verified storybook commit"
              exit 0
            fi
            echo "Push attempt $attempt failed; checking whether main advanced"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          echo "::error::Could not push validated publication after three attempts"
          exit 1

      - name: Save restartable partial media for the next daily run
        if: always() && hashFiles('sakura/books/_staging/**') != ''
        uses: actions/cache/save@v4
        with:
          path: sakura/books/_staging
          key: sakura-staging-v2-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-failed-run-${{ github.run_id }}
          path: |
            sakura/books/_staging/
            /tmp/sakura-http.log
          if-no-files-found: ignore

      - name: Write run summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## Sakura daily publishing"
            echo "- Result: **$RESULT**"
            echo "- Run: $RUN_ID"
            echo "- Schedule: code-change run plus daily 09:15 KST; target: 40 complete books; batch: one verified book per run"
            if [ "$RESULT" = success ]; then
              echo "- Every complete book passed media validation and browser QA before publication."
            else
              echo "- No incomplete book was added to the public catalog. Any partial media was cached for retry."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
