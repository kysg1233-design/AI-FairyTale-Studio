name: Weekly complete Sakura storybook publishing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sakura-weekly.yml']
  schedule:
    - cron: "5 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}sakura/
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade "beautifulsoup4>=4.12,<5" "Pillow>=11,<13"
      - id: secretcheck
        name: Verify audio tooling and secret
        shell: bash
        run: |
          command -v ffmpeg
          command -v ffprobe
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is missing. No book was published."
            exit 1
          fi
      - id: models
        name: Confirm configured Gemini models (without exposing key)
        shell: bash
        run: |
          set -euo pipefail
          for model in gemini-3.8-flash gemini-3.1-flash-image gemini-3.8-flash-lite-tts; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-goog-api-key: $GEMINI_API_KEY" "https://generativelanguage.googleapis.com/v1beta/models/$model")
            if [ "$status" != "200" ]; then
              echo "::error::Gemini model $model was not accessible (HTTP $status). Check API validity, model availability and quota."
              exit 1
            fi
            echo "Model accessible: $model"
          done
      - id: generate
        name: Generate and check a complete book
        run: python sakura/publish_weekly.py
      - id: validate
        name: Verify reader and all published books
        run: python sakura/check_site.py
      - id: commitbook
        name: Commit verified and fully complete book only
        shell: bash
        run: |
          git status --short
          git add sakura/books/
          if git diff --cached --quiet; then
            echo "No new complete book to publish."
            exit 0
          fi
          git config user.name "sakura-story-bot"
          git config user.email "sakura-story-bot@users.noreply.github.com"
          git commit -m "Publish complete weekly storybook (illustrations and both voices)"
          git push origin HEAD:main
      - name: Compose original prebuilt lullaby soundtrack
        run: python sakura/create_bgm.py
      - name: Bundle PageFlip for publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sakura/vendor
          npm pack page-flip@2.0.7 --pack-destination /tmp --silent
          tar -xOf /tmp/page-flip-2.0.7.tgz package/dist/js/page-flip.browser.js > sakura/vendor/page-flip.browser.js
          test -s sakura/vendor/page-flip.browser.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: publishpages
        name: Publish completed books to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save build status for automatic troubleshooting
        if: always()
        shell: bash
        env:
          STEP_SECRET: ${{ steps.secretcheck.outcome }}
          STEP_MODELS: ${{ steps.models.outcome }}
          STEP_GENERATE: ${{ steps.generate.outcome }}
          STEP_VALIDATE: ${{ steps.validate.outcome }}
          STEP_COMMIT: ${{ steps.commitbook.outcome }}
          STEP_PAGES: ${{ steps.publishpages.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, datetime
          stage = {k:os.getenv("STEP_"+k,"unknown") for k in ("SECRET","MODELS","GENERATE","VALIDATE","COMMIT","PAGES")}
          books = json.loads(pathlib.Path("sakura/books/index.json").read_text("utf-8")).get("books",[])
          outcome = "success" if all(stage[k]=="success" for k in stage) else "failure"
          result = {"status":outcome,"workflow":"weekly","run_id":os.getenv("GITHUB_RUN_ID"),
             "commit":os.getenv("GITHUB_SHA"),"time_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
             "stage":stage,"completed_books":len(books),"titles":[b["title"] for b in books]}
          pathlib.Path("sakura/build-status.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n","utf-8")
          print("Sakura build status:",json.dumps(result,ensure_ascii=False))
          PY
          git config user.name "sakura-story-bot"
          git config user.email "sakura-story-bot@users.noreply.github.com"
          git add sakura/build-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record public Sakura build diagnostics"
            git push origin HEAD:main
          fi
