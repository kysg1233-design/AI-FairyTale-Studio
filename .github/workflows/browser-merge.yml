name: GitHub-only studio browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'app-studio-v6.js'
      - 'server-render.js'
      - 'index.html'
      - 'studio-v6.html'
      - 'tests/ui-smoke.cjs'
      - '.github/workflows/browser-merge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Serve actual public website files
        run: |
          mkdir -p /tmp/fairytale-site
          cp index.html studio-v6.html style.css app.js app-studio-v6.js narration.js server-render.js config.js /tmp/fairytale-site/
          cd /tmp/fairytale-site
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fairytale-http.log 2>&1 &
      - name: Test mobile story and GitHub-only interface
        run: node tests/ui-smoke.cjs
      - name: Ensure server render has no Cloudflare dependency
        run: |
          node --check server-render.js
          node --check app-studio-v6.js
          ! grep -Ei 'cloudflare|r2.cloudflarestorage|workers.dev' server-render.js
          grep -q 'actions/workflows/render.yml/dispatches' server-render.js
