name: Publish studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'studio-v6.html'
      - 'style.css'
      - 'app.js'
      - 'app-studio-v6.js'
      - 'narration.js'
      - 'server-render.js'
      - 'config.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static studio
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax before publishing
        run: |
          node --check narration.js
          node --check app.js
          node --check app-studio-v6.js
          node --check server-render.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect ONLY public website files
        run: |
          mkdir -p site
          cp index.html studio-v6.html style.css app.js app-studio-v6.js narration.js server-render.js config.js site/
          touch site/.nojekyll
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
