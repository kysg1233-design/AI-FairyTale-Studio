name: Deploy Cloudflare API Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Check required deployment settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in repository Actions secrets."; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package.json
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy existing Worker (requires private R2 bucket and Worker secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('wrangler.toml')
          s=p.read_text()
          marker='REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID'
          if marker not in s:
              raise SystemExit('Expected Cloudflare account ID placeholder missing')
          p.write_text(s.replace(marker,os.environ['CLOUDFLARE_ACCOUNT_ID']))
          PY
          npx wrangler deploy --name ai-fairytale-studio-api
