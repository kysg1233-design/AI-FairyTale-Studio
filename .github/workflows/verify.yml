name: Validate studio source

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app-studio-v6.js'
      - 'narration.js'
      - 'config.js'
      - 'style.css'
      - 'tests/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check app-studio-v6.js
          node --check narration.js
          node --check config.js
      - name: Validate browser-only rendering and cut-edge audio safeguards
        run: |
          node - <<'JS'
          const fs=require('fs');
          const app=fs.readFileSync('app-studio-v6.js','utf8');
          const audio=fs.readFileSync('narration.js','utf8');
          const page=fs.readFileSync('index.html','utf8');
          if(!app.includes('FairyNarration.render('))throw Error('Browser renderer not connected');
          if(!audio.includes("joinPcm(voices)")||!audio.includes("'-c:a','aac'"))throw Error('Continuous audio track missing');
          if(!audio.includes('softenPcm(')||!audio.includes('afade=t=out:'))throw Error('Audio edge fades missing');
          if(page.includes('server-render.js')||page.includes('GitHub 토큰'))throw Error('Old GitHub render instructions remain');
          JS
      - name: Validate three-step interface and no bundled secrets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page=Path('index.html').read_text()
          for x in ('step1','step2','step3','storyForm','render'):
              assert f'id="{x}"' in page, x
          for x in ('step4','step5','step6'):
              assert f'id="{x}"' not in page, x
          assert Path('config.js').exists()
          assert not re.search(r'AIza[0-9A-Za-z_-]{30,}',Path('config.js').read_text())
          print('Three-step structure and public config checks passed.')
          PY
