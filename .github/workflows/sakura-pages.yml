name: Deploy Sakura Story Theater to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'sakura/**'
      - '.github/workflows/sakura-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: all-pages-publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}sakura/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg needed for background music production
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Compose original prebuilt lullaby soundtrack
        run: python sakura/create_mood_music.py
      - name: Bundle the exact PageFlip 2.0.7 browser engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sakura/vendor
          npm pack page-flip@2.0.7 --pack-destination /tmp --silent
          tar -xOf /tmp/page-flip-2.0.7.tgz package/dist/js/page-flip.browser.js > sakura/vendor/page-flip.browser.js
          test -s sakura/vendor/page-flip.browser.js
      - name: Validate Sakura site and complete books
        run: python sakura/check_site.py
      - name: Install Chromium for interactive browser QA
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run real Galaxy touch, audio and desktop book flip checks
        shell: bash
        run: |
          python -m http.server 8777 --bind 127.0.0.1 > /tmp/sakura-http.log 2>&1 &
          sleep 2
          SAKURA_URL=http://127.0.0.1:8777/sakura/ node sakura/qa_smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the real deployed URL on mobile and desktop
        env:
          SAKURA_URL: ${{ steps.deployment.outputs.page_url }}sakura/
        run: node sakura/qa_smoke.cjs
      - name: Save actual browser test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-pages-browser-proof
          path: |
            sakura/qa-result.json
            sakura/qa-desktop.png
            sakura/qa-galaxy-mobile.png
          if-no-files-found: ignore
