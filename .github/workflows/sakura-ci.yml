name: Validate Sakura Story Theater changes
on:
  push:
    branches: [main]
    paths:
      - 'sakura/**'
      - '.github/workflows/sakura-ci.yml'
      - '.github/workflows/sakura-weekly.yml'
      - '.github/workflows/sakura-pages.yml'
  pull_request:
    paths:
      - 'sakura/**'
      - '.github/workflows/sakura-ci.yml'
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate daily workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/sakura-weekly.yml"); puts "Daily workflow YAML syntax passed"'
      - name: Install Python test dependencies
        run: python -m pip install "beautifulsoup4==4.13.4" "Pillow==11.3.0" "mutagen==1.47.0" "imageio-ffmpeg==0.6.0"
      - name: Check Python syntax and parser regression tests
        run: |
          python -m py_compile sakura/publish_weekly.py sakura/prepare_title_audio.py sakura/create_bgm.py sakura/create_mood_music.py sakura/check_site.py
          python -m unittest sakura.test_publish_pipeline
      - name: Install audio encoder and compose the five original music tracks
        shell: bash
        run: |
          FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sf "$FFMPEG_BIN" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/ffmpeg-bin:$PATH"
          python sakura/create_mood_music.py
      - name: Check website safety and ready book files
        run: python sakura/check_site.py
      - name: Validate folktale candidates and source provenance
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('sakura/books/candidates.json').read_text('utf-8'))
          assert len(d)>=100
          assert len({(x['source_url'],x['heading']) for x in d})==len(d)
          assert set(x['region'] for x in d)=={'한국','일본','독일','그리스·세계','덴마크','아라비아'}
          assert all(x['source_url'].startswith('https://www.gutenberg.org/') for x in d)
          print('PASS:',len(d),'source-backed stories in 6 regions')
          PY
