async function prefetchBook(b,voice){

function fitStoryText(){
 const words=[...document.querySelectorAll('#book .leaf .words')];
 for(const inner of words){
  const title=inner.querySelector('h3'),para=inner.querySelector('p');if(!title||!para)continue;
  inner.classList.remove('text-tight');title.style.fontSize='';para.style.fontSize='';
  inner.style.justifyContent='';inner.style.padding='';inner.style.overflowY='';title.style.lineHeight='';para.style.lineHeight='';
  if(inner.clientHeight<100)continue; // PageFlip may keep non-visible sheets unmeasured. Fit when shown.
  const fits=()=>inner.scrollHeight<=inner.clientHeight+1&&title.scrollWidth<=title.clientWidth+1&&para.scrollWidth<=para.clientWidth+1;
  if(fits())continue;
  inner.classList.add('text-tight');
  // Determine a comfortable font size for the exact rendered book page.
  let normal=parseFloat(getComputedStyle(para).fontSize)||13;
  let head=parseFloat(getComputedStyle(title).fontSize)||16;
  for(let n=0;n<23&&!fits();n++){
   normal=Math.max(9,normal-.4);head=Math.max(11,head-.25);
   para.style.fontSize=normal+'px';title.style.fontSize=head+'px';
  }
  if(!fits()){
   inner.style.justifyContent='flex-start';
   inner.style.padding='2.5%';
   para.style.lineHeight='1.32';title.style.lineHeight='1.2';
  }
  // Keep the entire story visible; on an extreme device permit in-page scrolling.
  if(!fits())inner.style.overflowY='auto';
 }
}

// PageFlip.destroy() can remove the very #book element that hosted its sheets.

function mount(b,assets){

 pages.forEach(p=>host.append(p));
 flip=new St.PageFlip(host,{width:350,height:455,size:'stretch',minWidth:260,maxWidth:550,minHeight:338,maxHeight:720,showCover:false,drawShadow:true,maxShadowOpacity:.65,flippingTime:950,usePortrait:true,mobileScrollSupport:false,swipeDistance:25,useMouseEvents:false,disableFlipByClick:false,showPageCorners:true});

function updatePageTurnControls(){
 const max=active?active.pages.length:0;
 $('pagePrev').disabled=!active||currentPage<=0;

}
function turnOnePage(direction){
 if(!flip||!active)return;

}

}

function gestureBookPoint(e){

function gestureBegin(x,y,id){

function gestureMove(x,y,e){

function gestureEnd(x,y){
