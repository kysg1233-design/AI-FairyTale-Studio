</div><script>
'use strict';
const $=id=>document.getElementById(id);
let catalog=[],active=null,flip=null,currentPage=0,narrationOn=true,musicOn=true,loading=false,track=null,trackUrl=null,unlocked=false,ctx=null,musicTrack=null,introTrack=null;
const cache=new Map(); const loaded=new Map(); const decoded=new Map();
function safePath(x){if(typeof x!=='string'||!/^books\/[a-z0-9-]+\/[a-zA-Z0-9_.-]+$/.test(x))throw Error('잘못된 파일 경로');return x}
function filesOf(b,voice){return [b.cover,...b.pages.map(p=>p.image),...b.pages.map(p=>p.audio[voice]),...(b.title_audio?.[voice]?[b.title_audio[voice]]:[])]}
function isComplete(b){return !!b&&b.status==='ready'&&Array.isArray(b.pages)&&b.pages.length>=3&&b.pages.every(p=>p.image&&p.audio?.male&&p.audio?.female&&p.text)&&!!b.cover}
function setStatus(s){$('status').textContent=s}
async function fetchCatalog(){
 try{const r=await fetch('./books/index.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('catalogue unavailable');const j=await r.json();catalog=(j.books||[]).filter(isComplete)}
 catch(e){catalog=[];console.warn('Catalogue:',e)}
 paintLibrary();
}

let viewMode='all',category='all',searchText='',featured=null;
let favourites=new Set();try{favourites=new Set(JSON.parse(localStorage.getItem('sakura-favourites')||'[]'))}catch(e){favourites=new Set()}
function bookId(b){return b.cover}
function readCount(b){return Number(localStorage.getItem('sakura-reads-'+bookId(b))||0)}
function isFave(b){return favourites.has(bookId(b))}
function toggleFave(b){if(isFave(b))favourites.delete(bookId(b));else favourites.add(bookId(b));localStorage.setItem('sakura-favourites',JSON.stringify([...favourites]));paintLibrary()}
function countCategory(b,cat){
 const z=(b.region||'')+' '+(b.source_credit||'')+' '+(b.source_title||'');
 if(cat==='all')return true;
 if(cat==='한국')return b.region==='한국';
 if(cat==='이솝')return /Aesop|이솝|그리스/i.test(z);
 if(cat==='그림')return /Grimm|그림|독일/i.test(z);
 if(cat==='일본')return /일본|Japanese|Ozaki/i.test(z);
 if(cat==='안데르센')return /Andersen|안데르센|덴마크/i.test(z);
 if(cat==='아라비아')return /Arabian|Arabia|아라비아|Lang/i.test(z);
 if(cat==='세계')return b.region!=='한국';
 return true
}
function makeTile(b){
 const card=document.createElement('article');card.className='tile';
 const open=document.createElement('button');open.type='button';open.style.cssText='background:none;border:0;padding:0;width:100%;text-align:left;color:inherit';open.setAttribute('aria-label',b.title+' 읽기');
 const img=new Image();img.alt=b.title+' 표지';img.loading='lazy';img.src=safePath(b.cover);
 const desc=document.createElement('div'),title=document.createElement('strong'),sub=document.createElement('small');
 title.textContent=b.title;sub.textContent=(b.region||'세계')+' · '+b.pages.length+'장면';
 desc.append(title,sub);open.append(img,desc);open.onclick=()=>openBook(b);
 const fav=document.createElement('button');fav.type='button';fav.className='faveBtn';fav.textContent=isFave(b)?'♥':'♡';fav.setAttribute('aria-pressed',String(isFave(b)));fav.setAttribute('aria-label',b.title+' 찜하기');fav.onclick=()=>toggleFave(b);
 card.append(open,fav);return card
}
function paintLibrary(){
 const shelf=$('library'),items=catalog.filter(b=>countCategory(b,category)).filter(b=>viewMode!=='favs'||isFave(b)).filter(b=>b.title.toLocaleLowerCase().includes(searchText));
 if(viewMode==='popular')items.sort((a,b)=>readCount(b)-readCount(a)||a.title.localeCompare(b.title,'ko'));
 if(viewMode==='new')items.sort((a,b)=>String(b.published_at).localeCompare(String(a.published_at)));
 shelf.replaceChildren();items.forEach(b=>shelf.append(makeTile(b)));$('bookCount').textContent=items.length+'권';$('empty').style.display=items.length?'none':'block';
 const counts={'count-all':'all','count-korea':'한국','count-world':'세계','count-aesop':'이솝','count-grimm':'그림','count-japan':'일본','count-andersen':'안데르센','count-arabia':'아라비아'};
 for(const [id,key]of Object.entries(counts))$(id).textContent=catalog.filter(b=>countCategory(b,key)).length+'권';
 const titles={all:'📚 반짝반짝 동화책장',library:'📖 전체 동화책장',popular:'👑 인기 동화',new:'🗓️ 새로 나온 동화',favs:'♡ 내가 찜한 동화'};
 $('libraryHeading').textContent=titles[viewMode];
 const picks=$('recommendations');picks.replaceChildren();catalog.slice(-12).reverse().forEach(b=>picks.append(makeTile(b)));
 const chosen=catalog[0]||null;featured=chosen;
 $('featuredTitle').textContent=chosen?chosen.title:'곧 만나게 될 새로운 이야기';
 $('featuredDesc').textContent=chosen?(chosen.region||'세계'):'새로운 동화를 기다려 주세요';
 $('featuredImage').style.display=chosen?'block':'none';if(chosen)$('featuredImage').src=safePath(chosen.cover);
 $('featuredRead').disabled=!chosen;
 document.querySelectorAll('[data-mode]').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===viewMode||(viewMode==='all'&&btn.dataset.mode==='all')));
 document.querySelectorAll('[data-cat]').forEach(btn=>btn.classList.toggle('active',btn.dataset.cat===category))
}
function switchMode(mode){closeBook();viewMode=mode;category='all';paintLibrary();if(mode!=='all')document.querySelector('.stageShell').scrollIntoView({behavior:'smooth',block:'start'})}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>switchMode(btn.dataset.mode));
document.querySelectorAll('[data-cat]').forEach(btn=>btn.onclick=()=>{category=btn.dataset.cat;viewMode='library';paintLibrary()});
$('search').oninput=()=>{searchText=$('search').value.trim().toLocaleLowerCase();paintLibrary()};
$('heroBrowse').onclick=()=>document.querySelector('.stageShell').scrollIntoView({behavior:'smooth',block:'start'});
$('featuredRead').onclick=()=>{if(featured)openBook(featured)};
function audioOff(){for(const source of [track,introTrack]){if(source){try{source.stop()}catch(e){}try{source.disconnect()}catch(e){}}}track=null;introTrack=null;if(trackUrl){URL.revokeObjectURL(trackUrl);trackUrl=null}}
// Five original, pre-rendered theme tracks. Never generate music during reading.
const musicNames={calm:'sakura-lullaby.mp3',joyful:'sakura-joyful.mp3',adventure:'sakura-adventure.mp3',mystery:'sakura-mystery.mp3',tender:'sakura-tender.mp3'};
const musicCache=new Map();let musicTheme=null,musicSwitchId=0,musicFadeTimer=null;
const musicGain=.32; // Quiet under the voice, louder when narration is off.
function sceneMood(p){
 if(p?.mood&&Object.hasOwn(musicNames,p.mood))return p.mood;
 const words=((p?.heading||'')+' '+(p?.text||'')).toLowerCase();
 if(/무섭|두렵|어둠|깜깜|비밀|수상|괴물|마녀|몰래|걱정|두근|속삭|이상한|놀랐|의심/.test(words))return 'mystery';
 if(/달리|뛰어|쫓|모험|여행|싸우|용감|도전|힘차|훌쩍|폴짝|와다다|달려|펄쩍|찾아나/.test(words))return 'adventure';
 if(/슬프|눈물|외롭|그리|미안|사과|위로|지쳤|서운|울었|불쌍|안타깝/.test(words))return 'tender';
 if(/기뻐|기쁘|웃음|행복|즐거|신나|축하|선물|반갑|성공|해냈|환호|기적|놀라운/.test(words))return 'joyful';
 return 'calm';
}
function musicVolume(){return narrationOn?musicGain:.52}
function stopMusic(){
 musicSwitchId++;
 if(musicFadeTimer){clearInterval(musicFadeTimer);musicFadeTimer=null}
 if(musicTrack){musicTrack.pause();musicTrack.currentTime=0;musicTrack=null}
 musicTheme=null;
}
function preloadMusic(){
 for(const [theme,file] of Object.entries(musicNames)){
  if(musicCache.has(theme))continue;
  const item=new Audio('./assets/'+file);item.loop=true;item.preload='auto';musicCache.set(theme,item);
 }
}
function playMusic(mood){
 if(!musicOn||!active)return;
 const desired=Object.hasOwn(musicNames,mood)?mood:sceneMood(active.pages[currentPage]);
 if(musicTrack&&musicTheme===desired){musicTrack.volume=musicVolume();return}
 preloadMusic();
 const old=musicTrack;
 const next=musicCache.get(desired);
 if(!next)return;
 if(musicFadeTimer){clearInterval(musicFadeTimer);musicFadeTimer=null}
 // Reuse the cached players so switching scenes does not redownload a soundtrack.
 if(next!==old){next.currentTime=0;next.volume=0}
 const serial=++musicSwitchId;
 musicTrack=next;musicTheme=desired;
 next.play().then(()=>{
  let elapsed=0;const frames=12,target=musicVolume();
  musicFadeTimer=setInterval(()=>{
   if(serial!==musicSwitchId){clearInterval(musicFadeTimer);musicFadeTimer=null;return}
   elapsed++;
   next.volume=Math.min(target,target*elapsed/frames);
   if(old&&old!==next)old.volume=Math.max(0,target*(1-elapsed/frames));
   if(elapsed>=frames){
    clearInterval(musicFadeTimer);musicFadeTimer=null;
    if(old&&old!==next){old.pause();old.currentTime=0}
   }
  },115);
 }).catch(e=>{
  if(serial!==musicSwitchId)return;
  musicTrack=null;musicTheme=null;
  if(old&&old!==next)old.pause();
  console.warn('Music could not start:',e.message);
 });
}
async function prefetchBook(b,voice){
 let count=0;const list=filesOf(b,voice);const result=new Map();
 for(const path of list){const p=safePath(path);let blob=loaded.get(p);
  if(!blob){const resp=await fetch('./'+p);if(!resp.ok)throw Error('사전 제작 파일 누락: '+p);blob=await resp.blob();if(blob.size<800)throw Error('파일 크기가 비정상적으로 작습니다: '+p);loaded.set(p,blob)}
  result.set(p,blob);count++;$('loading').textContent='책의 모든 이미지·나레이션 준비 '+count+' / '+list.length;
 }
 // Decode all illustrations and selected voice audio before enabling the book.
 await Promise.all(b.pages.map(p=>new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(result.get(p.image));img.onload=()=>{URL.revokeObjectURL(url);resolve()};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('삽화 파일이 손상됐습니다'))};img.src=url})));
 if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
 const voiceFiles=[...b.pages.map(p=>p.audio[voice]),...(b.title_audio?.[voice]?[b.title_audio[voice]]:[])];
 await Promise.all(voiceFiles.map(async path=>{if(decoded.has(path))return;const bytes=await result.get(path).arrayBuffer();const sound=await ctx.decodeAudioData(bytes);if(sound.duration<1)throw Error('음성 파일이 손상됐습니다');decoded.set(path,sound)}));
 return result;
}
async function openBook(b){
 if(loading)return;loading=true;unlocked=true;active=b;try{localStorage.setItem('sakura-reads-'+bookId(b),String(readCount(b)+1))}catch(e){};audioOff();stopMusic();try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}if(musicOn)playMusic(sceneMood(b.pages[0]));
 $('home').style.display='none';$('reader').style.display='block';$('bookTitle').textContent=b.title;
 const source=$('source');source.replaceChildren();source.append('원전 출처: ');const a=document.createElement('a');a.href=b.source_url||'#';a.target='_blank';a.rel='noopener noreferrer';a.textContent=b.source_title||'원전 보기';source.append(a);
 $('loading').style.display='block';$('book').style.display='none';$('pageNumber').textContent='모든 페이지를 먼저 준비하고 있습니다.';
 try{const assets=await prefetchBook(b,$('voice').value);if(active!==b)return;
  mount(b,assets);$('loading').style.display='none';$('book').style.display='block';setStatus('그림과 음성 전체 준비 완료');playPage(0)}
 catch(e){setStatus('준비 실패: '+e.message);$('loading').textContent='그림책을 열지 않았습니다: '+e.message;$('book').style.display='none'}
 finally{loading=false}
}
function fitStoryText(){
 const words=[...document.querySelectorAll('#book .leaf .words')];
 for(const inner of words){
  const title=inner.querySelector('h3'),para=inner.querySelector('p');if(!title||!para)continue;
  inner.classList.remove('text-tight');title.style.fontSize='';para.style.fontSize='';
  inner.style.justifyContent='';inner.style.padding='';inner.style.overflowY='';title.style.lineHeight='';para.style.lineHeight='';
  if(inner.clientHeight<100)continue; // PageFlip may keep non-visible sheets unmeasured. Fit when shown.
  const fits=()=>inner.scrollHeight<=inner.clientHeight+1&&title.scrollWidth<=title.clientWidth+1&&para.scrollWidth<=para.clientWidth+1;
  if(fits())continue;
  inner.classList.add('text-tight');
  // Determine a comfortable font size for the exact rendered book page.
  let normal=parseFloat(getComputedStyle(para).fontSize)||13;
  let head=parseFloat(getComputedStyle(title).fontSize)||16;
  for(let n=0;n<23&&!fits();n++){
   normal=Math.max(9,normal-.4);head=Math.max(11,head-.25);
   para.style.fontSize=normal+'px';title.style.fontSize=head+'px';
  }
  if(!fits()){
   inner.style.justifyContent='flex-start';
   inner.style.padding='2.5%';
   para.style.lineHeight='1.32';title.style.lineHeight='1.2';
  }
  // Keep the entire story visible; on an extreme device permit in-page scrolling.
  if(!fits())inner.style.overflowY='auto';
 }
}
let fitTimer=null;
function scheduleTextFit(){clearTimeout(fitTimer);fitTimer=setTimeout(()=>requestAnimationFrame(fitStoryText),120)}
window.addEventListener('resize',scheduleTextFit);
function mount(b,assets){
 if(flip){try{flip.destroy()}catch(e){}flip=null}
 const host=$('book');host.replaceChildren();
 if(!window.St||!St.PageFlip)throw Error('책장 넘김 엔진 로딩 실패. 네트워크를 확인하세요.');
 const pages=[];
 b.pages.forEach((p,i)=>{
  // One scene = one physical leaf, with picture and text together.
  const leaf=document.createElement('div');leaf.className='leaf storyLeaf';
  const image=new Image();image.alt=p.heading+' 장면';image.src=URL.createObjectURL(assets.get(p.image));
  const inner=document.createElement('div');inner.className='words';const h=document.createElement('h3');h.textContent=p.heading;const text=document.createElement('p');text.textContent=p.text;inner.append(h,text);
  leaf.append(image,inner);pages.push(leaf);
 });
 pages.forEach(p=>host.append(p));
 flip=new St.PageFlip(host,{width:350,height:455,size:'stretch',minWidth:260,maxWidth:550,minHeight:338,maxHeight:720,showCover:false,drawShadow:true,maxShadowOpacity:.65,flippingTime:950,usePortrait:true,mobileScrollSupport:false,useMouseEvents:true,disableFlipByClick:true,showPageCorners:true});
 flip.on('flip',e=>{nativeTouchTurn=true;const n=Math.min(b.pages.length-1,e.data);if(n!==currentPage)playPage(n);scheduleTextFit()});
 flip.loadFromHTML(pages);
 scheduleTextFit();
}
function playPage(n){if(!active)return;currentPage=n;if(musicOn)playMusic(sceneMood(active.pages[n]));$('pageNumber').textContent=(n+1)+' / '+active.pages.length;audioOff();if(!narrationOn)return;
 const p=active.pages[n].audio[$('voice').value],sound=decoded.get(p);if(!sound){setStatus('해당 음성 파일은 준비되지 않았습니다');return}
 try{
  if(ctx.state==='suspended')ctx.resume();
  const volume=ctx.createGain();volume.gain.value=.9;volume.connect(ctx.destination);
  let start=ctx.currentTime+.035;
  // The separate book title is pre-generated with the same selected voice.
  if(n===0&&active.title_audio?.[$('voice').value]){
   const title=decoded.get(active.title_audio[$('voice').value]);
   if(title){introTrack=ctx.createBufferSource();introTrack.buffer=title;introTrack.connect(volume);introTrack.start(start);start+=title.duration+.18}
  }
  const source=ctx.createBufferSource();source.buffer=sound;source.connect(volume);track=source;source.start(start);
 }catch(e){setStatus('나레이션을 재생할 수 없습니다: '+e.message)}
}
function closeBook(){active=null;audioOff();stopMusic();$('reader').style.display='none';$('home').style.display='block';}
$('back').onclick=closeBook;
$('narration').onclick=()=>{narrationOn=!narrationOn;$('narration').classList.toggle('on',narrationOn);$('narration').setAttribute('aria-pressed',String(narrationOn));$('narration').textContent=narrationOn?'🔊 나레이션 ON':'🔈 나레이션 OFF';if(active)playPage(currentPage)};
$('music').onclick=()=>{musicOn=!musicOn;$('music').classList.toggle('on',musicOn);$('music').setAttribute('aria-pressed',String(musicOn));$('music').textContent=musicOn?'♫ 배경음 ON':'♫ 배경음 OFF';if(musicOn&&active)playMusic(sceneMood(active.pages[currentPage]));else stopMusic()};
$('book').addEventListener('pointerdown',()=>{if(musicOn&&active&&!musicTrack)playMusic(sceneMood(active.pages[currentPage]))},{passive:true});
// On narrow touch devices St.PageFlip can miss a swipe starting outside its paper edge.
// Keep real drag turning; only fall back to animated flip if the touch gesture made no turn.
let mouseDragStart=null;
$('book').addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'||!flip)return;
 mouseDragStart={x:e.clientX,y:e.clientY,index:flip.getCurrentPageIndex()};
},{capture:true});
document.addEventListener('pointerup',e=>{
 if(!mouseDragStart||e.pointerType==='touch'||!flip)return;
 const from=mouseDragStart;mouseDragStart=null;
 const dx=e.clientX-from.x,dy=e.clientY-from.y;
 if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.15)return;
 setTimeout(()=>{
  // Only recover a missed desktop mouse drag. Never generate a second turn.
  if(!flip||flip.getCurrentPageIndex()!==from.index)return;
  if(dx<0)flip.flipNext();else flip.flipPrev();
 },1130);
},{capture:true});
let touchStart=null, nativeTouchTurn=false;
$('book').addEventListener('touchstart',e=>{
 const t=e.touches[0];if(!t||!flip)return;
 nativeTouchTurn=false;touchStart={x:t.clientX,y:t.clientY,index:flip.getCurrentPageIndex()};
},{capture:true,passive:true});
$('book').addEventListener('touchend',e=>{
 if(!touchStart||!flip)return;
 const t=e.changedTouches[0];if(!t)return;
 const from=touchStart;touchStart=null;
 const dx=t.clientX-from.x,dy=t.clientY-from.y;
 if(Math.abs(dx)<48||Math.abs(dx)<Math.abs(dy)*1.15)return;
 setTimeout(()=>{
  // Wait until native animation has completed before considering a fallback.
  // Otherwise the same finger swipe triggers TWO independent page flips.
  if(!flip||nativeTouchTurn||flip.getCurrentPageIndex()!==from.index)return;
  if(dx<0)flip.flipNext();else flip.flipPrev();
 },1150);
},{capture:true,passive:true});

$('voice').onchange=async()=>{if(!active)return;audioOff();const b=active;$('loading').style.display='block';$('loading').textContent='선택한 목소리 음성을 준비 중…';try{await prefetchBook(b,$('voice').value);if(active===b)playPage(currentPage)}catch(e){setStatus(e.message)}finally{$('loading').style.display='none'}};
window.addEventListener('pagehide',()=>{audioOff();stopMusic();loaded.clear();decoded.clear()});
fetchCatalog();
